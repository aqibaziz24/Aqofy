<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inbox + Menu - One File</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;user-select:none}
body{background:#eef2f5;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;align-items:center}
#app{width:100%;max-width:500px;height:100vh;height:100dvh;background:#ffffff;display:flex;flex-direction:column;position:relative;box-shadow:0 0 15px rgba(0,0,0,0.08);overflow:hidden}

/* TOP HEADER */
.app-top-header{height:56px;background:#ffffff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #e5e7eb;flex-shrink:0;z-index:20;gap:10px}
.left-icon,.right-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111827;font-size:20px;transition:all 0.15s;flex-shrink:0}
.left-icon:active,.right-icon:active{background:#f1f5f9}
.top-search-wrap{flex:1;display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid #e5e7eb;border-radius:22px;padding:8px 14px;height:38px}
.top-search-wrap i{color:#94a3b8;font-size:13px;flex-shrink:0}
.top-search-wrap input{flex:1;background:transparent;border:none;outline:none;font-size:13.5px;color:#111}
.top-search-wrap input::placeholder{color:#94a3b8}

/* SIDEBAR */
.sidebar-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:99;opacity:0;visibility:hidden;transition:all 0.3s ease}
.sidebar-overlay.active{opacity:1;visibility:visible}
.sidebar{position:absolute;top:0;left:-300px;width:285px;height:100%;background:#ffffff;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.15);transition:left 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden}
.sidebar.active{left:0}
.sidebar-header{padding:16px 15px;background:#3b82f6;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sidebar-header h3{font-size:15px}
.sidebar-header .close-btn{width:30px;height:30px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sidebar-profile{display:flex;align-items:center;gap:12px;padding:16px 18px;background:#f8fafc;border-bottom:1px solid #eef2f7}
.sidebar-profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#7c5cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.sidebar-profile-name{font-weight:700;font-size:14px;color:#111}
.sidebar-profile-sub{font-size:11.5px;color:#64748b;margin-top:2px}
.sidebar-menu{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-menu-item{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;color:#334155;font-size:14px;font-weight:500;transition:all 0.15s;position:relative}
.sidebar-menu-item i{width:20px;text-align:center;color:#64748b;font-size:15px}
.sidebar-menu-item:active{background:#f1f5f9}
.sidebar-menu-item.danger{color:#ef4444}
.sidebar-menu-item.danger i{color:#ef4444}
.sidebar-divider{height:1px;background:#f1f5f9;margin:6px 18px}
.sidebar-footer{padding:10px 15px;border-top:1px solid #f1f5f9;flex-shrink:0}
.sidebar-cancel-btn{width:100%;padding:10px;background:#f1f5f9;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;color:#475569;display:flex;align-items:center;justify-content:center;gap:8px}

/* INBOX CSS */
#view-messages{flex:1;display:flex;flex-direction:column;height:100%;background:#f2f2f2;overflow:hidden}
.msg-inbox-wrap{flex:1;display:flex;flex-direction:column;background:#f2f2f2;overflow-y:auto}
.y99-room{display:flex;align-items:center;gap:10px;background:#fff;padding:12px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background 0.15s}
.y99-room:active{background:#f8fafc}
.y99-room-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.y99-room-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.y99-room-top{display:flex;justify-content:space-between;align-items:center}
.y99-room-name{font-size:13.5px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;display:flex;align-items:center;gap:6px}
.y99-room-time{font-size:11px;color:#3b82f6;flex-shrink:0}
.y99-room-last{font-size:11.5px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat View */
#y99ChatView{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#f2f2f2;z-index:50;flex-direction:column}
#y99ChatView.active{display:flex}
.y99-chat-header{background:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.y99-chat-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#333;border-radius:50%}
.y99-chat-back:active{background:#f1f5f9}
.y99-chat-avatar{width:38px;height:38px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.y99-chat-info{flex:1;min-width:0}
.y99-chat-name{font-size:13.5px;font-weight:700;color:#111}
.y99-chat-sub{font-size:11px;color:#22c55e}
.y99-chat-messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;background:#eef2f5;background-image: radial-gradient(#e0e0e0 1px, transparent 1px);background-size:20px 20px}
.y99-msg-row{display:flex;gap:8px;align-items:flex-end;animation:y99Pop 0.25s ease}
@keyframes y99Pop{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.y99-msg-avatar{width:28px;height:28px;border-radius:50%;background:#ddd;color:#555;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.y99-msg-avatar.bot{background:linear-gradient(135deg,#3b82f6,#7c5cf0);color:#fff}
.y99-msg-bubble{background:#fff;padding:8px 12px;border-radius:14px;border-bottom-left-radius:4px;font-size:13px;color:#222;max-width:100%;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,0.08)}
.y99-msg-time{font-size:10px;color:#94a3b8;margin-top:2px}
.y99-typing{display:flex;gap:4px;background:#fff;padding:10px 12px;border-radius:14px;border-bottom-left-radius:4px}
.y99-typing span{width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:y99Bounce 1.4s infinite}
.y99-typing span:nth-child(2){animation-delay:0.2s}
.y99-typing span:nth-child(3){animation-delay:0.4s}
@keyframes y99Bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.section-label{padding:10px 14px 6px;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:0.8px;background:#f2f2f2}
</style>
</head>
<body>
<div id="app">
  <!-- Top Header with Search -->
  <div class="app-top-header">
    <div class="left-icon" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></div>
    <div class="top-search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search conversations..." oninput="filterRooms(this.value)"></div>
    <div class="right-icon" onclick="logoutUser()"><i class="fa-solid fa-ellipsis-vertical"></i></div>
  </div>

  <!-- Sidebar -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header"><h3>Menu</h3><div class="close-btn" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></div></div>
    <div class="sidebar-profile">
      <div class="sidebar-profile-avatar" id="profileAvatar">G</div>
      <div><div class="sidebar-profile-name" id="profileName">Loading...</div><div class="sidebar-profile-sub" id="profileEmail">guest mode</div></div>
    </div>
    <div class="sidebar-menu">
      <div class="sidebar-menu-item" onclick="closeSidebar()"><i class="fa-solid fa-inbox"></i> Inbox</div>
      <div class="sidebar-menu-item" onclick="alert('Profile: '+document.getElementById('profileEmail').innerText)"><i class="fa-solid fa-user"></i> Profile</div>
      <div class="sidebar-menu-item"><i class="fa-solid fa-gear"></i> Settings</div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-menu-item danger" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
    </div>
    <div class="sidebar-footer"><button class="sidebar-cancel-btn" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i> Close</button></div>
  </div>

  <!-- Inbox View -->
  <div id="view-messages">
    <div class="msg-inbox-wrap" id="msgInboxWrap">
      <div class="section-label">PENDING</div>
      <div id="pendingList"></div>
      <div class="section-label">YOUR CONVERSATIONS</div>
      <div id="yourList"><div id="yourEmpty" style="padding:18px;text-align:center;color:#94a3b8;font-size:12px;display:none;">No conversations yet</div></div>
    </div>
  </div>

  <!-- Chat View -->
  <div id="y99ChatView">
    <div class="y99-chat-header">
      <div class="y99-chat-back" onclick="closeY99Chat()"><i class="fa-solid fa-arrow-left"></i></div>
      <div class="y99-chat-avatar" style="background:linear-gradient(135deg,#3b82f6,#7c5cf0)"><i class="fa-solid fa-bell"></i></div>
      <div class="y99-chat-info"><div class="y99-chat-name" id="y99ChatName">Notification_Bot!</div><div class="y99-chat-sub" id="y99ChatSub">typing...</div></div>
    </div>
    <div class="y99-chat-messages" id="y99ChatMessages"></div>
  </div>

  <!-- Loading overlay for auth check -->
  <div id="authLoading" style="position:absolute;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
    <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;color:#3b82f6"></i>
    <div style="font-size:13px;color:#64748b;font-weight:600">Checking session...</div>
  </div>
</div>

<script type="module">
import { Client, Account } from "https://cdn.jsdelivr.net/npm/appwrite@14.0.1/+esm";
import APPWRITE_CONFIG from "./appwrite-config.js";

const client = new Client()
  .setEndpoint(APPWRITE_CONFIG.endpoint)
  .setProject(APPWRITE_CONFIG.projectId);
const account = new Account(client);

// --- AUTH GUARD ---
async function checkAuth(){
  try{
    const user = await account.get();
    // user mil gaya
    document.getElementById('authLoading').style.display='none';
    const name = user.name || user.email || 'Guest';
    const email = user.email || (user.$id.startsWith('guest') || user.name==='' ? 'Guest ID: '+user.$id.slice(0,8) : 'Anonymous');
    const isGuest = !user.email;
    document.getElementById('profileName').innerText = isGuest ? 'Guest User' : name;
    document.getElementById('profileEmail').innerText = isGuest ? 'Guest Session - View Only' : email;
    document.getElementById('profileAvatar').innerText = name.charAt(0).toUpperCase();
    localStorage.setItem('appwrite_user', JSON.stringify(user));
  }catch(err){
    // No session -> redirect to login
    window.location.href = 'index.html';
  }
}
checkAuth();

window.openSidebar = function(){ document.getElementById('sidebar').classList.add('active'); document.getElementById('sidebarOverlay').classList.add('active'); }
window.closeSidebar = function(){ document.getElementById('sidebar').classList.remove('active'); document.getElementById('sidebarOverlay').classList.remove('active'); }
window.filterRooms = function(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.y99-room').forEach(room=>{
    const name = room.querySelector('.y99-room-name')?.innerText.toLowerCase() || '';
    const last = room.querySelector('.y99-room-last')?.innerText.toLowerCase() || '';
    room.style.display = (name.includes(q) || last.includes(q) || q==='') ? 'flex' : 'none';
  });
}

// Inbox logic
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function getTimeStr(){ const now=new Date(); let h=now.getHours(); const m=now.getMinutes().toString().padStart(2,'0'); const am=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+am; }

let pendingRooms = JSON.parse(localStorage.getItem('pendingRooms') || 'null');
if(!pendingRooms){
  pendingRooms = [{id:'notif_bot', name:"Notification_Bot!", last:"Please verify your email...", time:"now", color:"linear-gradient(135deg,#3b82f6,#7c5cf0)", unread:true}];
  localStorage.setItem('pendingRooms', JSON.stringify(pendingRooms));
}
let yourRooms = JSON.parse(localStorage.getItem('yourConversations') || '[]');
const botTexts = [
  "Please Verify your email, <go in manu profile and verify your email>",
  "Go to setting for set your sounds system and our suggestions if you are girl off your pm in setting",
  "Thanks for reading our important messages"
];
let chatHistory = JSON.parse(localStorage.getItem('notifChatHistory') || '[]');
let hasBotSent = localStorage.getItem('botHasSent') === 'true';

function renderLists(){
  const pendingEl = document.getElementById('pendingList');
  const yourEl = document.getElementById('yourList');
  const yourEmpty = document.getElementById('yourEmpty');
  if(!pendingEl || !yourEl) return;
  pendingEl.innerHTML = '';
  if(pendingRooms.length===0){
    pendingEl.innerHTML = '<div style="padding:12px;text-align:center;color:#aaa;font-size:12px;">No pending</div>';
  } else {
    pendingRooms.forEach(room=>{
      const d=document.createElement('div');
      d.className='y99-room';
      d.onclick=()=> openY99Chat(room,'pending');
      d.innerHTML=`<div class="y99-room-icon" style="background:${room.color}"><i class="fa-solid fa-bell"></i></div>
        <div class="y99-room-main"><div class="y99-room-top"><div class="y99-room-name">${room.name}</div><div class="y99-room-time">${room.time}</div></div><div class="y99-room-last">${room.last}</div></div>
        ${room.unread?'<div style="width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>':''}`;
      pendingEl.appendChild(d);
    });
  }
  yourEl.querySelectorAll('.y99-room').forEach(e=>e.remove());
  if(yourRooms.length===0){
    if(yourEmpty) yourEmpty.style.display='block';
  } else {
    if(yourEmpty) yourEmpty.style.display='none';
    yourRooms.forEach(room=>{
      const d=document.createElement('div');
      d.className='y99-room';
      d.onclick=()=> openY99Chat(room,'your');
      d.innerHTML=`<div class="y99-room-icon" style="background:${room.color}"><i class="fa-solid fa-bell"></i></div>
        <div class="y99-room-main"><div class="y99-room-top"><div class="y99-room-name">${room.name}</div><div class="y99-room-time">${room.time}</div></div><div class="y99-room-last">${room.last}</div></div>`;
      yourEl.appendChild(d);
    });
  }
}

window.openY99Chat = function(room, from){
  document.getElementById('y99ChatView').classList.add('active');
  document.getElementById('y99ChatName').innerText = room.name;
  const msgContainer = document.getElementById('y99ChatMessages');
  msgContainer.innerHTML='';

  if(hasBotSent && chatHistory.length>0){
    document.getElementById('y99ChatSub').innerText='';
    chatHistory.forEach(m=>{ addY99Message(m.sender, m.text, m.time, false); });
    if(from==='pending'){ moveToYour(); }
    return;
  }

  document.getElementById('y99ChatSub').innerText='typing...';
  let delay=400;
  botTexts.forEach((txt, idx)=>{
    setTimeout(()=> showY99Typing(), delay-200);
    setTimeout(()=>{
      hideY99Typing();
      const timeStr = getTimeStr();
      addY99Message('bot', txt, timeStr, true);
      if(idx===botTexts.length-1){
        document.getElementById('y99ChatSub').innerText='';
        hasBotSent=true;
        localStorage.setItem('botHasSent','true');
        if(from==='pending') moveToYour();
      }
    }, delay);
    delay+=1300;
  });
}

function moveToYour(){
  if(pendingRooms.length===0) return;
  const room = pendingRooms[0];
  pendingRooms=[];
  localStorage.setItem('pendingRooms', JSON.stringify(pendingRooms));
  if(!yourRooms.find(r=>r.id===room.id)){
    yourRooms.unshift({id:room.id, name:room.name, last:botTexts[botTexts.length-1], time:getTimeStr(), color:room.color});
    localStorage.setItem('yourConversations', JSON.stringify(yourRooms));
  }
  setTimeout(renderLists, 600);
}

window.closeY99Chat = function(){
  document.getElementById('y99ChatView').classList.remove('active');
  renderLists();
}

function addY99Message(sender, text, timeStr, save){
  const container=document.getElementById('y99ChatMessages');
  const row=document.createElement('div');
  row.className='y99-msg-row';
  row.innerHTML=`<div class="y99-msg-avatar ${sender==='bot'?'bot':''}">${sender==='bot'?'<i class="fa-solid fa-robot"></i>':'U'}</div>
    <div style="display:flex;flex-direction:column;gap:2px;max-width:80%"><div class="y99-msg-bubble">${escapeHtml(text)}</div><div class="y99-msg-time">${timeStr}</div></div>`;
  container.appendChild(row);
  container.scrollTop=container.scrollHeight;
  if(save){
    chatHistory.push({sender, text, time:timeStr});
    localStorage.setItem('notifChatHistory', JSON.stringify(chatHistory));
  }
}

function showY99Typing(){
  const c=document.getElementById('y99ChatMessages');
  hideY99Typing();
  const t=document.createElement('div');
  t.id='y99Typing';
  t.className='y99-msg-row';
  t.innerHTML=`<div class="y99-msg-avatar bot"><i class="fa-solid fa-robot"></i></div><div class="y99-typing"><span></span><span></span><span></span></div>`;
  c.appendChild(t);
  c.scrollTop=c.scrollHeight;
}
function hideY99Typing(){ const t=document.getElementById('y99Typing'); if(t) t.remove(); }

setTimeout(renderLists, 300);
</script>
