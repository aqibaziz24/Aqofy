<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aqofy - Auth</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:#eef2f5;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px;color:#333}
.auth-wrapper{width:100%;max-width:400px}
.brand-top{text-align:center;margin-bottom:24px}
.aqofy-logo{width:64px;height:64px;position:relative;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#3b82f6 0%,#6366f1 45%,#8b5cf6 100%);box-shadow:0 8px 24px rgba(99,102,241,0.35);animation:logoFloat 3s ease-in-out infinite}
.logo-letter{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1.5px;position:relative;z-index:1}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.flowing-logo{font-size:28px;font-weight:900;letter-spacing:-0.04em;background:linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6,#ec4899,#f59e0b,#10b981,#3b82f6);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:aqofyFlow 60s linear infinite;display:inline-block}
@keyframes aqofyFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.auth-card{background:#fff;width:100%;padding:28px 26px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08);animation:loginPop 0.4s ease}
@keyframes loginPop{0%{opacity:0;transform:translateY(10px) scale(0.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
.tabs{display:flex;gap:6px;background:#eef2f5;padding:4px;border-radius:8px;margin-bottom:22px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:6px;background:transparent;font-weight:700;font-size:13px;color:#666;cursor:pointer;transition:all .2s}
.tab-btn.active{background:#fff;color:#3b82f6;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.auth-title{font-size:22px;font-weight:800;color:#333;margin-bottom:6px;text-align:center}
.auth-sub{color:#666;font-size:13px;margin-bottom:22px;text-align:center;line-height:1.5}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{display:block;font-size:11px;color:#555;margin-bottom:5px;font-weight:700;letter-spacing:0.5px}
.input-group input{width:100%;padding:12px 12px;border:1.5px solid #ddd;border-radius:8px;outline:none;font-size:14px;transition:.2s;background:#fff}
.input-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.12)}
.pass-wrap{position:relative;display:flex;align-items:center}
.pass-wrap input{padding-right:44px;flex:1}
.eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:6px;color:#9ca3af}
.eye-btn:hover{color:#4b5563;background:#f3f4f6}
.hint{font-size:11px;color:#64748b;margin-top:4px;line-height:1.4}
.hint.error{color:#ef4444}
.hint.ok{color:#16a34a}
.auth-btn{width:100%;padding:12px;background:linear-gradient(90deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(59,130,246,0.3);margin-top:4px}
.auth-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#999;font-size:11px;font-weight:700;letter-spacing:0.5px}
.divider span{flex:1;height:1px;background:#e5e7eb}
.guest-btn{width:100%;padding:11px;background:#fff;border:1.5px dashed #94a3b8;border-radius:8px;font-weight:700;font-size:13px;color:#475569;cursor:pointer;transition:.2s}
.guest-btn:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
.error-msg{display:none;margin-top:12px;color:#ef4444;background:#fef2f2;border:1px solid #fecaca;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:600}
.success-msg{display:none;margin-top:12px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;padding:9px 10px;border-radius:8px;font-size:12px;font-weight:600}
.footer-text{text-align:center;margin-top:18px;font-size:12px;color:#6b7280}
.footer-text a{color:#3b82f6;font-weight:700;text-decoration:none;cursor:pointer}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="auth-wrapper">
  <div class="brand-top">
    <div class="logo-wrap" style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="aqofy-logo"><span class="logo-letter">A</span></div>
      <div class="flowing-logo">Aqofy</div>
    </div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button id="loginTabBtn" class="tab-btn active" onclick="switchMode('login')"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <button id="signupTabBtn" class="tab-btn" onclick="switchMode('signup')"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
    </div>

    <h2 id="title" class="auth-title">Welcome Back</h2>
    <p id="subtitle" class="auth-sub">Please login to continue</p>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div id="nameGroup" class="input-group hidden">
        <label>FULL NAME</label>
        <input id="fullName" type="text" placeholder="Your name">
      </div>

      <div class="input-group">
        <label>EMAIL</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="input-group">
        <label>PASSWORD <span style="font-weight:400;color:#94a3b8;font-size:10px">(min 8 chars + @ + special)</span></label>
        <div class="pass-wrap">
          <input id="password" type="password" placeholder="••••••••" required oninput="validatePassLive(this.value)">
          <button type="button" class="eye-btn" onclick="togglePass('password', this)"><i class="fa-regular fa-eye"></i></button>
        </div>
        <div id="passHint" class="hint">Password me kam se kam 8 characters, 1 @ aur 1 special char (! # $ % etc) lazmi hai</div>
      </div>

      <div id="confirmGroup" class="input-group hidden">
        <label>CONFIRM PASSWORD</label>
        <div class="pass-wrap">
          <input id="confirmPassword" type="password" placeholder="Repeat password">
          <button type="button" class="eye-btn" onclick="togglePass('confirmPassword', this)"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>

      <div id="loginOptions" class="row" style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#555;font-weight:600;cursor:pointer"><input type="checkbox" style="accent-color:#3b82f6"> Remember</label>
        <span style="font-size:12px;color:#3b82f6;font-weight:700;cursor:pointer" onclick="alert('Appwrite pe email recovery enable karen to yahan recovery email jayegi')">Forgot?</span>
      </div>

      <button id="submitBtn" type="submit" class="auth-btn"><i class="fa-solid fa-right-to-bracket" style="margin-right:6px"></i> LOGIN</button>
    </form>

    <div class="divider"><span></span> OR <span></span></div>
    <button class="guest-btn" onclick="guestLogin()"><i class="fa-solid fa-user-secret" style="margin-right:6px"></i> Continue as Guest</button>

    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>

    <div class="footer-text"><span id="switchText">Don't have an account? <a onclick="switchMode('signup')">Create one</a></span></div>
  </div>
</div>

<script type="module">
import { Client, Account, ID } from "https://cdn.jsdelivr.net/npm/appwrite@14.0.1/+esm";
import APPWRITE_CONFIG from "./appwrite-config.js";

const client = new Client()
  .setEndpoint(APPWRITE_CONFIG.endpoint)
  .setProject(APPWRITE_CONFIG.projectId);

const account = new Account(client);

window.account = account;
window.ID = ID;

// Check already logged in?
try {
  const user = await account.get();
  if(user){
    window.location.href = "main.html";
  }
} catch(e){ /* not logged */ }

let mode = 'login';

window.togglePass = function(inputId, btn){
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if(input.type==='password'){
    input.type='text';
    icon.className='fa-regular fa-eye-slash';
    btn.style.color='#3b82f6';
  } else {
    input.type='password';
    icon.className='fa-regular fa-eye';
    btn.style.color='#9ca3af';
  }
}

window.validatePassLive = function(val){
  const hint = document.getElementById('passHint');
  const hasMin = val.length >= 8;
  const hasAt = val.includes('@');
  const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val) && /[@]/.test(val) ? true : /[!#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?@]/.test(val) && val.includes('@'); 
  // simple rule: must contain @ and length >=8 and at least one special from list including @
  const specialRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;
  const ok = hasMin && hasAt && specialRegex.test(val);
  if(val.length===0){
    hint.textContent = "Password me kam se kam 8 characters, 1 @ aur 1 special char (! # $ % etc) lazmi hai";
    hint.className="hint";
  } else if(!ok){
    hint.textContent = (!hasMin ? "• 8 chars minimum " : "") + (!hasAt ? "• @ required " : "") + (!specialRegex.test(val) ? "• special char required" : "");
    hint.className="hint error";
  } else {
    hint.textContent = "✓ Strong password";
    hint.className="hint ok";
  }
  return ok;
}

function isPasswordValid(p){
  if(p.length < 8) return {ok:false, msg:"Password minimum 8 characters ka hona chahiye"};
  if(!p.includes('@')) return {ok:false, msg:"Password me @ lazmi hai"};
  const specialRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;
  if(!specialRegex.test(p)) return {ok:false, msg:"Password me kam se kam 1 special character (@ ! # $ etc) lazmi hai"};
  return {ok:true};
}

window.switchMode = function(newMode){
  mode=newMode;
  const isSignup = mode==='signup';
  document.getElementById('loginTabBtn').classList.toggle('active',!isSignup);
  document.getElementById('signupTabBtn').classList.toggle('active',isSignup);
  document.getElementById('nameGroup').classList.toggle('hidden',!isSignup);
  document.getElementById('confirmGroup').classList.toggle('hidden',!isSignup);
  document.getElementById('loginOptions').style.display = isSignup ? 'none' : 'flex';
  document.getElementById('fullName').required=isSignup;
  document.getElementById('confirmPassword').required=isSignup;
  document.getElementById('title').innerText=isSignup?'Create Account':'Welcome Back';
  document.getElementById('subtitle').innerText=isSignup?'Create your Aqofy account':'Please login to continue';
  document.getElementById('submitBtn').innerHTML=isSignup?'<i class="fa-solid fa-user-plus" style="margin-right:6px"></i> CREATE ACCOUNT':'<i class="fa-solid fa-right-to-bracket" style="margin-right:6px"></i> LOGIN';
  document.getElementById('switchText').innerHTML=isSignup?'Already have an account? <a onclick="switchMode(\'login\')">Login</a>':'Don\'t have an account? <a onclick="switchMode(\'signup\')">Create one</a>';
  hideMsg();
}

function showMsg(t,type){
  const e=document.getElementById('errorBox'),s=document.getElementById('successBox');
  hideMsg();
  if(type==='success'){s.style.display='block';s.innerText=t}
  else{e.style.display='block';e.innerText=t}
}
function hideMsg(){
  document.getElementById('errorBox').style.display='none';
  document.getElementById('successBox').style.display='none';
}

window.handleAuth = async function(e){
  e.preventDefault();
  hideMsg();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const name = document.getElementById('fullName').value.trim();
  const confirm = document.getElementById('confirmPassword').value.trim();
  const btn = document.getElementById('submitBtn');

  if(!email || !pass){ showMsg('Please fill all required fields','error'); return; }

  const v = isPasswordValid(pass);
  if(!v.ok){ showMsg(v.msg,'error'); return; }

  if(mode==='signup'){
    if(!name){ showMsg('Please enter full name','error'); return; }
    if(pass!==confirm){ showMsg('Passwords do not match','error'); return; }
  }

  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Please wait...';

  try{
    if(mode==='signup'){
      await account.create(ID.unique(), email, pass, name);
      await account.createEmailPasswordSession(email, pass);
      showMsg('Account created! Redirecting...','success');
    } else {
      await account.createEmailPasswordSession(email, pass);
      showMsg('Login successful! Redirecting...','success');
    }
    setTimeout(()=>{ window.location.href="main.html"; }, 800);
  }catch(err){
    console.error(err);
    showMsg(err.message || 'Auth failed. Check email/password','error');
    btn.disabled=false;
    btn.innerHTML=originalText;
  }
}

window.guestLogin = async function(){
  hideMsg();
  const btn = document.querySelector('.guest-btn');
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Creating guest...';
  try{
    await account.createAnonymousSession();
    showMsg('Guest session created — opening main...','success');
    setTimeout(()=>{ window.location.href="main.html"; }, 700);
  }catch(err){
    console.error(err);
    // If anonymous not enabled, show helpful message
    if(err.message.includes('disabled') || err.message.includes('not enabled')){
      showMsg('Guest login is disabled in Appwrite Console. Please enable Anonymous auth in Auth > Settings.','error');
    } else {
      showMsg(err.message,'error');
    }
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-user-secret" style="margin-right:6px"></i> Continue as Guest';
  }
}
</script>
</body>
</html>
